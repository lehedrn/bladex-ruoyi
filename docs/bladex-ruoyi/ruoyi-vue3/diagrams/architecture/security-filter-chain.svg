  <path d="M 650,440 L 650,455 L 650,455 L 650,470" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linejoin="round"/>
  <path d="M 650,590 L 650,605 L 650,605 L 650,620" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linejoin="round"/>
  <path d="M 650,700 L 650,715 L 650,715 L 650,730" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linejoin="round"/>
  <path d="M 650,850 L 650,865 L 650,865 L 650,880" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linejoin="round"/>
  <path d="M 650,930 L 825,930 L 825,880 L 1000,880" stroke="#e53935" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="5,5" stroke-linejoin="round"/>
  <rect x="795" y="870" width="60" height="20" fill="#ffffff" stroke="none" rx="3"/>
  <text x="825" y="881" font-family="Arial, sans-serif" font-size="10" fill="#424242" text-anchor="middle" dominant-baseline="middle">异常捕获</text>
</svg>
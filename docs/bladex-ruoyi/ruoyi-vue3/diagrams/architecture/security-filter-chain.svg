<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#424242"/>
  </marker>
</defs>
  <rect x="575" y="20" width="150" height="50" fill="#b3e5fc" stroke="#0288d1" stroke-width="1"/>
  <text x="650" y="45" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">HTTP 请求</text>
  <rect x="425" y="100" width="450" height="340" rx="5" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="650" y="270" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Servlet Filter 链 (javax.servlet.Filter)</text>
  <rect x="475" y="120" width="350" height="40" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="650" y="140" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">1. RepeatableFilter</text>
  <rect x="475" y="175" width="350" height="40" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="650" y="195" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2. XssFilter</text>
  <rect x="475" y="230" width="350" height="40" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="650" y="250" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">3. RefererFilter</text>
  <rect x="475" y="285" width="350" height="40" rx="5" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="650" y="305" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">4. CorsFilter</text>
  <rect x="475" y="340" width="350" height="40" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="650" y="360" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5. JwtAuthenticationTokenFilter</text>
  <rect x="425" y="470" width="450" height="120" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="650" y="530" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Spring Security FilterChain</text>
  <rect x="425" y="620" width="450" height="80" rx="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="650" y="660" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Spring Interceptor</text>
  <rect x="475" y="635" width="350" height="40" rx="5" fill="#e8d5f5" stroke="#ab47bc" stroke-width="1"/>
  <text x="650" y="655" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">RepeatSubmitInterceptor</text>
  <rect x="100" y="730" width="1100" height="120" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="650" y="790" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">AOP 切面 (拦截方法调用)</text>
  <rect x="130" y="745" width="220" height="40" rx="5" fill="#fce4ec" stroke="#666666" stroke-width="1"/>
  <text x="240" y="765" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">@DataScope → DataScopeAspect</text>
  <rect x="370" y="745" width="220" height="40" rx="5" fill="#fce4ec" stroke="#666666" stroke-width="1"/>
  <text x="480" y="765" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">@DataSource → DataSourceAspect</text>
  <rect x="610" y="745" width="220" height="40" rx="5" fill="#fce4ec" stroke="#666666" stroke-width="1"/>
  <text x="720" y="765" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">@Log → LogAspect</text>
  <rect x="850" y="745" width="220" height="40" rx="5" fill="#fce4ec" stroke="#666666" stroke-width="1"/>
  <text x="960" y="765" font-family="Arial, sans-serif" font-size="11" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="normal">@RateLimiter → RateLimiterAspect</text>
  <rect x="425" y="880" width="450" height="50" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="650" y="905" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Controller (@PreAuthorize)</text>
  <rect x="900" y="880" width="200" height="50" rx="5" fill="#ffcdd2" stroke="#e53935" stroke-width="1"/>
  <text x="1000" y="905" font-family="Arial, sans-serif" font-size="12" fill="#424242" text-anchor="middle" dominant-baseline="middle" font-weight="bold">GlobalExceptionHandler</text>
  <text x="490" y="140" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">包装 Request 为可重复读取</text>
  <text x="490" y="195" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">GET/DELETE 跳过，POST/PUT 清洗参数</text>
  <text x="490" y="250" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">仅保护 /profile/*，校验 allowedDomains</text>
  <text x="490" y="305" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">处理跨域 OPTIONS 预检请求</text>
  <text x="490" y="360" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">解析 JWT → 获取 uuid → Redis 查 LoginUser → 设置 SecurityContext</text>
  <text x="440" y="492" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">@EnableMethodSecurity + SessionCreationPolicy.STATELESS</text>
  <text x="440" y="520" font-family="Arial, sans-serif" font-size="11" fill="#82b366" text-anchor="left" font-weight="normal" dominant-baseline="middle">放行: 静态资源 / 验证码 / 登录接口 / @Anonymous 标注接口</text>
  <text x="440" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333333" text-anchor="left" font-weight="normal" dominant-baseline="middle">拦截: 其余所有请求 → 需要有效 JWT Token</text>
  <text x="490" y="655" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">sessionStorage 指纹 + Redis 对比，防 5s 内重复提交</text>
  <text x="140" y="798" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">数据权限 SQL 拼接</text>
  <text x="380" y="798" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">主从数据源切换</text>
  <text x="620" y="798" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">异步记录操作日志</text>
  <text x="860" y="798" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">Redis 令牌桶限流</text>
  <text x="1000" y="135" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="center" font-weight="bold" dominant-baseline="middle">安全纵深 7 层</text>
  <text x="920" y="170" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">1. XSS 过滤</text>
  <text x="920" y="195" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">2. Referer 防盗链</text>
  <text x="920" y="220" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">3. JWT 认证</text>
  <text x="920" y="245" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">4. BCrypt 密码</text>
  <text x="920" y="270" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">5. 重试限制</text>
  <text x="920" y="295" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">6. IP 黑名单</text>
  <text x="920" y="320" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="left" font-weight="normal" dominant-baseline="middle">7. 数据脱敏</text>
